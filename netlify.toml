[build]
  # Comando para construir el proyecto Angular en producción
  command = "ng build --configuration production"
  # Directorio donde se generan los archivos estáticos
  publish = "dist/jome"

[build.environment]
  # Versión de Node.js recomendada para Angular
  NODE_VERSION = "18"

# Redirecciones para SPA (Single Page Application)
[[redirects]]
  # Redirigir todas las rutas a index.html para el routing de Angular
  from = "/*"
  to = "/index.html"
  status = 200

# Headers para seguridad y rendimiento
[[headers]]
  # Aplicar a todos los archivos
  for = "/*"
  [headers.values]
    # Seguridad básica
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Cache para assets estáticos
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Aplicar solo a archivos HTML
  for = "*.html"
  [headers.values]
    # No cachear HTML para siempre obtener la última versión
    Cache-Control = "public, max-age=0, must-revalidate"

# Configuración de compresión
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true
  minify = true

[build.processing.images]
  compress = true
