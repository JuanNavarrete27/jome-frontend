<!-- Cinematic background FX -->
<app-bg-fx></app-bg-fx>

<!-- cursor glow -->
<div class="cursor-glow" aria-hidden="true"></div>

<!-- scroll progress -->
<div class="top-progress" [style.transform]="'scaleX(' + progress() + ')'" [style.opacity]="progress() > 0.01 ? 1 : 0" aria-hidden="true"></div>

<header class="app-header" [class.app-header--scrolled]="scrolled()">
  <div class="app-header__inner">
    <a class="brand" href="#" (click)="scrollToHome(); $event.preventDefault()">
      <!-- ✅ LOGO más visible -->
      <span class="brand__logoWrap" aria-hidden="true">
        <img class="brand__logo" src="assets/logo.png" alt="JoMe Soluciones Digitales" />
      </span>

      <span class="brand__text">
        <span class="brand__name">JoMe</span>
        <span class="brand__tag">Desarrollo Web • Sistemas • Soluciones Digitales</span>
      </span>
    </a>

    <!-- Desktop CTA -->
    <div class="cta" *ngIf="!showHamburger">
      <a magnetic class="btn btn--primary" href="#" (click)="openWhatsApp(); $event.preventDefault()">
        Pedir propuesta
      </a>
    </div>

    <!-- Hamburger Menu Button -->
    <button 
      *ngIf="showHamburger" 
      class="hamburger-btn" 
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-nav"
      aria-label="Toggle navigation menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</header>

<!-- Mobile Navigation Drawer -->
<div 
  *ngIf="showHamburger" 
  class="mobile-nav-overlay" 
  [class.mobile-nav-overlay--open]="menuOpen()"
  (click)="closeMenu()">
  
  <nav 
    id="mobile-nav" 
    class="mobile-nav" 
    [class.mobile-nav--open]="menuOpen()"
    (click)="$event.stopPropagation()">
    
    <div class="mobile-nav__header">
      <div class="brand mobile-brand">
        <span class="brand__logoWrap" aria-hidden="true">
          <img class="brand__logo" src="assets/logo.png" alt="JoMe Soluciones Digitales" />
        </span>
        <span class="brand__text">
          <span class="brand__name">JoMe</span>
          <span class="brand__tag">Soluciones Digitales</span>
        </span>
      </div>
      
      <button 
        class="mobile-nav__close" 
        (click)="closeMenu()"
        aria-label="Close menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    
    <div class="mobile-nav__links">
    </div>
    
    <div class="mobile-nav__footer">
      <a 
        class="btn btn--primary btn--full" 
        href="#" 
        (click)="openWhatsApp(); closeMenu(); $event.preventDefault()">
        Pedir propuesta
      </a>
    </div>
  </nav>
</div>

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <div class="app-footer__inner">
    <div class="foot-left">
      <div class="foot-logo">
        <!-- ✅ LOGO visible footer -->
        <span class="foot-logo__wrap" aria-hidden="true">
          <img class="foot-logo__img" src="assets/logo.png" alt="JoMe Soluciones Digitales" />
        </span>

        <div>
          <div class="foot-title">JoMe Soluciones Digitales</div>
          <div class="foot-sub">Desarrollo de páginas web, sistemas y soluciones digitales profesionales</div>
        </div>
      </div>

      <div class="foot-copy"> {{ year }} JoMe Soluciones Digitales — Todos los derechos reservados.</div>
    </div>

    <div class="foot-right">
      <div class="social-links">
        <a href="https://wa.me/59892454958" target="_blank" class="social-link" aria-label="WhatsApp">
          <svg xmlns="http://www.w3.org/2000/svg"
               width="24" height="24"
               viewBox="0 0 24 24"
               aria-label="WhatsApp">
            <path
              d="M12 2a10 10 0 0 0-8.66 15.02L2 22l5.13-1.35A10 10 0 1 0 12 2Z"
              fill="none"
              stroke="#FFFFFF"
              stroke-width="2"
              stroke-linejoin="round"
            />
            <path
              d="M16.7 13.9c-.2-.1-1.3-.6-1.5-.7-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.8 6.8 0 0 1-3.2-3.2c-.1-.2 0-.4.1-.5l.6-.7c.2-.2.2-.4.1-.6l-.7-1.6c-.1-.3-.4-.3-.6-.3h-.5c-.2 0-.5.1-.7.3-.2.2-.9.8-.9 2 0 1.2.9 2.4 1 2.6.1.2 1.7 2.7 4.2 3.7 2.4 1 2.4.7 2.9.7.4 0 1.3-.5 1.5-1 .2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3Z"
              fill="#FFFFFF"
            />
          </svg>
        </a>
        <a href="https://instagram.com/jome.uy" target="_blank" class="social-link" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-label="Instagram">
            <rect x="4" y="4" width="16" height="16" rx="4" stroke="#FFFFFF" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" stroke="#FFFFFF" stroke-width="2"/>
            <circle cx="17" cy="7" r="1.2" fill="#FFFFFF"/>
          </svg>
        </a>
      </div>
      <div style="height: 20px;"></div>
      <a class="foot-link" href="#" (click)="scrollToHome(); $event.preventDefault()">Volver arriba ↑</a>
    </div>
  </div>
</footer>
